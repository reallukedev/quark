[workspace]
resolver = "2"
members = ["crates/core", "crates/server", "crates/testkit", "crates/mcp"]

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "MIT"
repository = "https://github.com/reallukedev/quark"
homepage = "https://github.com/reallukedev/quark"
authors = ["Luke"]
keywords = ["xmpp", "jabber", "chat", "server", "federation"]
categories = ["network-programming"]
rust-version = "1.88"

[workspace.dependencies]
quark-core = { path = "crates/core" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
large_futures = "warn"

[profile.dev]
# Line tables are enough for backtraces and keep build folders a fraction of the size.
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
