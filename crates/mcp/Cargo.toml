[package]
name = "quark-mcp"
description = "An MCP server that lets an AI assistant manage a running Quark through its admin socket"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
# rmcp needs a newer compiler than the rest of the workspace.
rust-version = "1.88"

[dependencies]
rand = "0.8"
rmcp = { version = "3.5", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["net", "io-util", "time", "rt", "macros"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }

[lints]
workspace = true
