[package]
name = "quark"
description = "XMPP in a box: a modern, single-binary XMPP server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "quark"
path = "src/main.rs"

[features]
default = ["mcp"]
# `quark mcp`: the admin tools for AI assistants (needs Rust 1.88 for rmcp).
mcp = ["dep:quark-mcp"]

[dependencies]
quark-core.workspace = true
quark-mcp = { path = "../mcp", optional = true }
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = { version = "0.3", features = ["sink"] }
hex = "0.4"
hickory-resolver = "0.24"
hmac = "0.12"
md-5 = "0.10"
crc32fast = "1"
parking_lot = "0.12"
pbkdf2 = "0.12"
rand = "0.8"
rcgen = "0.13"
rusqlite = { version = "0.32", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
stringprep = "0.1"
socket2 = { version = "0.5", features = ["all"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
x509-parser = "0.16"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
