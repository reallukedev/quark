[package]
name = "quark"
description = "XMPP in a box: a modern, single-binary XMPP server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "quark"
path = "src/main.rs"

[features]
default = ["mcp"]
# `quark mcp`: the admin tools for AI assistants (needs Rust 1.88 for rmcp).
mcp = ["dep:quark-mcp"]

[dependencies]
quark-core.workspace = true
quark-mcp = { path = "../mcp", optional = true }
anyhow = "1"
arc-swap = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = { version = "0.3", features = ["sink"] }
hex = "0.4"
hickory-resolver = "0.26"
hmac = "0.12"
if-addrs = "0.15"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
ipnet = "2"
lru = "0.18"
idna = "1"
md-5 = "0.10"
crc32fast = "1"
dashmap = "6"
miniz_oxide = "0.8"
parking_lot = "0.12"
pbkdf2 = "0.12"
rand = "0.10"
rcgen = "0.13"
rusqlite = { version = "0.32", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# PEM parsing (`PemObject`) needs 1.9 or later.
rustls-pki-types = "1.9"
serde = { version = "1", features = ["derive"] }
stringprep = "0.1"
socket2 = { version = "0.5", features = ["all"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
toml = "0.8"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
x509-parser = "0.16"
webpki-roots = "1"
qrcode = { version = "0.14", default-features = false }
httpdate = "1"
percent-encoding = "2"

[target.'cfg(unix)'.dependencies]
# The effective user id, to check who owns the admin socket (no unsafe libc calls).
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }

[lints]
workspace = true
