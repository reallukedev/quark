[package]
name = "quark-testkit"
description = "Runs a real Quark server in-process and talks to it like a client, for tests"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
autotests = false

[[test]]
name = "protocol"
path = "tests/main.rs"

[dependencies]
quark = { path = "../server" }
quark-core.workspace = true
anyhow = "1"
base64 = "0.22"
futures-util = { version = "0.3", features = ["sink"] }
hmac = "0.12"
pbkdf2 = "0.12"
rand = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.29"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = "0.13"

[dev-dependencies]
axum = "0.8"
serde_json = "1"

[lints]
workspace = true
