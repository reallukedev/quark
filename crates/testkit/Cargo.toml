[package]
name = "quark-testkit"
description = "Runs a real Quark server in-process and talks to it like a client, for tests"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
quark = { path = "../server" }
quark-core.workspace = true
anyhow = "1"
base64 = "0.22"
hmac = "0.12"
pbkdf2 = "0.12"
rand = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = "0.13"

[lints]
workspace = true
